[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-transcriber-ov"
version = "0.3.0"
description = "Local audio/video transcription with Whisper — Intel iGPU via OpenVINO or CPU-only servers via faster-whisper — with optional speaker diarization. No cloud, your data stays on your machine."
readme = "README.md"
# MIT as the expression, the whole file as the text. The licence is the MIT
# license word for word with a wish in front of it, and the wish says of
# itself that nothing in it is a condition - so what a machine needs to know
# about the terms is "MIT", and a scanner that reported anything else would be
# telling a downstream user they have an obligation they do not have. The
# words themselves travel as License-File, which is where a person reads them.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roberto Rambaldi" }]
requires-python = ">=3.11"
keywords = ["whisper", "openvino", "faster-whisper", "transcription", "diarization",
            "speech-to-text", "qt", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
# The core stays light: the transcription engine is chosen with an extra, so a
# server never pulls in OpenVINO and a laptop never pulls in CTranslate2
# unless it wants both.
dependencies = [
    "imageio-ffmpeg",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/rrambaldi/audio-transcriber"
Repository = "https://github.com/rrambaldi/audio-transcriber"
Issues = "https://github.com/rrambaldi/audio-transcriber/issues"
Changelog = "https://github.com/rrambaldi/audio-transcriber/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Servers and machines without a GPU: CTranslate2, int8 quantisation.
cpu = ["faster-whisper>=1.0"]
# PCs with an Intel iGPU or NPU.
openvino = ["optimum-intel[openvino]", "transformers"]
# "Who said what" (runs on the CPU).
diarize = ["pyannote.audio"]
# Summaries written by a local model, on an Intel iGPU or NPU. openvino-genai
# runs the model; optimum-intel and transformers are only needed the first
# time, to convert one — a directory that is already OpenVINO IR loads with
# openvino-genai alone. Nothing here talks to a network service: the model
# runs on this machine, which is the whole point of the feature.
summarize-ov = ["openvino-genai>=2025.0", "optimum-intel[openvino]", "transformers"]
# Summaries written by a local model on plain CPU cores, through llama.cpp:
# the machine with no Intel device at all. Deliberately not part of "all" and
# not part of any installer's default, because there is no wheel for it on
# most platforms and pip builds it from source — half an hour on the two-core
# server this is for. The engine also accepts a "llama-server" binary instead,
# which is one file and needs no compiler; see docs/summary.md.
summarize-cpp = ["llama-cpp-python>=0.3"]
# The local web interface ("audio-transcriber web").
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
# The desktop window ("audio-transcriber gui"). Both halves are named on
# purpose: QtMultimedia — the microphone and the player — lives in
# PySide6-Addons, and pip only checks the *name* "PySide6", so an environment
# that already has PySide6-Essentials (or a Qt from conda-forge) satisfies
# "PySide6" and never gains multimedia. Asking for Addons too is safe: it pins
# PySide6-Essentials to its own version, so the halves cannot drift apart.
# The window still opens without Addons — it says what is missing instead of
# offering a recorder and a player that cannot work.
gui = ["PySide6>=6.6", "PySide6-Addons>=6.6"]
# Choosing the audio system and the source the way Audacity does, recording
# what the speakers play (WASAPI loopback), and mixing two sources into one
# file. Two libraries because on Windows neither does both: PortAudio has the
# host APIs and their input devices, and soundcard opens a render endpoint
# with AUDCLNT_STREAMFLAGS_LOOPBACK, which the PortAudio wheel refuses to do.
# Without this extra the window still records, through Qt, from a microphone.
record = ["sounddevice>=0.4.6", "soundcard>=0.4.2"]
all = ["faster-whisper>=1.0", "optimum-intel[openvino]", "transformers", "pyannote.audio",
       "openvino-genai>=2025.0",
       "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9",
       "PySide6>=6.6", "PySide6-Addons>=6.6",
       "sounddevice>=0.4.6", "soundcard>=0.4.2"]
dev = ["pytest>=7", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
audio-transcriber = "audio_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The bundled keyword sets, the icon set and the web interface are data, not
# modules. The icons and the typefaces are shared: the browser and the desktop
# window both take theirs from data/brand.
[tool.setuptools.package-data]
audio_transcriber = ["data/vocabularies/*.txt", "data/brand/*",
                     "data/brand/fonts/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # function call in default argument: not a pattern used here
    "SIM105", # contextlib.suppress is not clearer than try/except: pass here
]

[tool.ruff.lint.per-file-ignores]
# The message catalogue is data: wrapping the strings would make it harder to
# read and to diff against a translation.
"src/audio_transcriber/i18n.py" = ["E501"]
"tests/*" = ["E501"]
