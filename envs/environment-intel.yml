# Ambiente per PC con iGPU/NPU Intel (backend OpenVINO).
# Per un server senza GPU usa environment-cpu.yml.
name: srt-ov
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - optimum-intel[openvino]
      - transformers
      - imageio-ffmpeg   # ffmpeg incluso: nessuna installazione esterna
      - numpy
      - faster-whisper   # utile anche qui come fallback su CPU
      - pyannote.audio   # solo per --diarize ("chi dice cosa"), gira su CPU
      - PySide6          # solo per la finestra desktop (audio-transcriber gui)
      - sounddevice      # scelta del sistema audio e del dispositivo
      - soundcard        # registrare quello che riproducono gli altoparlanti
